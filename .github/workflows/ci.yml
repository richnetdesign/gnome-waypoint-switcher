name: Build Extension

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y glib2.0-bin gjs gnome-shell gnome-shell-extension-prefs

      - name: Validate GSettings schema
        run: |
          glib-compile-schemas --strict --dry-run schemas

      - name: Compute artifact version
        id: version
        run: |
          semver="$(git describe --always --tags --dirty)"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"

      # - name: Check GNOME API compatibility
      #   run: |
      #     scripts/check-gnome-compat.sh

      - name: Package extension
        run: |
          mkdir -p dist
          gnome-extensions pack \
            --force \
            --extra-source README.md \
            --out-dir dist

      - name: Upload extension artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: gnome-waypoint-switcher-extension
          filename: gnome-waypoint-switcher-extension
          version: ${{ steps.version.outputs.semver }}
          path: dist/*.zip
          append-max-detail-suffix: true
          retention-days: 7
